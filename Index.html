<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario Starlink</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    padding:15px;
    background:#f4f6f9;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#16325c;
    margin-bottom:20px;
}

h2{
    color:#16325c;
    margin-top:0;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    color:white;
    cursor:pointer;
}

.btnAgregar{
    background:#28a745;
}

.btnCSV{
    background:#0078d4;
}

.btnLimpiar{
    background:#dc3545;
}

ul{
    list-style:none;
    margin:0;
    padding:0;
}

li{
    background:#f7f7f7;
    margin-bottom:5px;
    padding:10px;
    border-radius:6px;
}

.oculto{
    display:none;
}

.badge{
    background:#16325c;
    color:white;
    padding:3px 8px;
    border-radius:10px;
}

</style>

</head>
<body>

<h1>📦 Inventario Starlink</h1>

<div class="card">

    <h2>Operación</h2>

    <select id="operacion" onchange="cambiarOperacion()">
        <option value="stock">Alta de Stock</option>
        <option value="reserved">Reserva</option>
        <option value="shipped">Despacho</option>
        <option value="delivered">Entrega</option>
    </select>

</div>

<div class="card" id="panelStock">

    <h2>Alta de Stock</h2>

    <label>Ubicación</label>

    <select id="location">
        <option>Quesada</option>
        <option>CdS - NQN</option>
        <option>Depo PE</option>
        <option>Ramm</option>
    </select>

    <label>Motivo</label>

    <input id="reason" value="Ingreso de equipo nuevo">

</div>

<div class="card oculto" id="panelMovimiento">

    <h2>Datos Comerciales</h2>

    <label>Partner</label>

    <select id="partnerId">
        <option value="">Seleccione Partner</option>
        <option value="ait">AITUE</option>
        <option value="cirion">CIRION</option>
        <option value="cmpc">CMPC</option>
        <option value="itx-pe">INTERNEXA</option>
        <option value="muncl">MUNDO</option>
        <option value="redc">REDCOL</option>
        <option value="sonda">SONDA</option>
        <option value="tpzarg">TPZ-Argentina</option>
        <option value="tpzchile">TPZ-Chile</option>
        <option value="tpzcol">TPZ-Colombia</option>
        <option value="tpzcostarica">TPZ-Costa Rica</option>
        <option value="tpzdemo">TPZ-Ops</option>
        <option value="tpzglobal">TPZ-Global</option>
        <option value="tpzperu">TPZ-Peru</option>
    </select>

    <label>Customer</label>
    <input id="customerId">

    <label>Ownership</label>

    <select id="ownershipType" onchange="mostrarLease()">
        <option value="byo">BYO (Venta)</option>
        <option value="leased">Leased</option>
        <option value="owned">Owned</option>
    </select>

    <div id="leaseBlock" class="oculto">

        <label>Contrato</label>
        <input id="ownershipContractRef">

        <label>Fin Leasing</label>
        <input type="date" id="ownershipLeaseEndsAt">

    </div>

</div>

<div class="card">

    <h2>Carga de Kits</h2>

    <label>Kit ID</label>

    <input
        id="kitInput"
        placeholder="Ej: KIT00001">

    <button
        class="btnAgregar"
        onclick="agregarKit()">

        ➕ Agregar Kit

    </button>

</div>

<div class="card">

    <h2>
        Equipos Cargados
        <span
            id="contador"
            class="badge">

            0

        </span>
    </h2>

    <ul id="lista"></ul>

    <button
        class="btnCSV"
        onclick="generarCSV()">

        ⬇ Descargar CSV

    </button>

    <button
        class="btnLimpiar"
        onclick="limpiarLista()">

        🗑 Limpiar Lista

    </button>

</div>

<script>

let equipos = [];

function cambiarOperacion(){

    let operacion =
        document.getElementById("operacion").value;

    let panelStock =
        document.getElementById("panelStock");

    let panelMovimiento =
        document.getElementById("panelMovimiento");

    if(operacion === "stock"){

        panelStock.classList.remove("oculto");
        panelMovimiento.classList.add("oculto");

    }
    else{

        panelStock.classList.add("oculto");
        panelMovimiento.classList.remove("oculto");

    }

}

function mostrarLease(){

    let ownership =
        document.getElementById("ownershipType").value;

    let leaseBlock =
        document.getElementById("leaseBlock");

    if(ownership === "leased"){

        leaseBlock.classList.remove("oculto");

    }
    else{

        leaseBlock.classList.add("oculto");

    }

}

function agregarKit(){

    let kit =
        document.getElementById("kitInput")
        .value
        .trim()
        .toUpperCase();

    if(kit === ""){
        return;
    }

    if(equipos.includes(kit)){
        alert("El kit ya existe.");
        return;
    }

    equipos.push(kit);

    document.getElementById("kitInput").value="";

    actualizarLista();

}

function actualizarLista(){

    document.getElementById("contador").innerText =
        equipos.length;

    let lista =
        document.getElementById("lista");

    lista.innerHTML = "";

    equipos.forEach(function(kit){

        let li =
            document.createElement("li");

        li.innerText = kit;

        lista.appendChild(li);

    });

}

function limpiarLista(){

    equipos = [];

    actualizarLista();

}

function generarCSV(){

    let operacion =
        document.getElementById("operacion").value;

    let csv = "";

    if(operacion === "stock"){

        let motivo =
            document.getElementById("reason").value;

        let ubicacion =
            document.getElementById("location").value;

        csv =
            "kitId,
