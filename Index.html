<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario Starlink</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    padding:15px;
    background:#f4f6f9;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#16325c;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.btnAgregar{
    background:#28a745;
}

.btnCSV{
    background:#0078d4;
}

.btnLimpiar{
    background:#dc3545;
}

.oculto{
    display:none;
}

ul{
    list-style:none;
    padding:0;
}

li{
    background:#f5f5f5;
    padding:10px;
    margin-bottom:5px;
    border-radius:6px;
}

.badge{
    background:#16325c;
    color:white;
    padding:4px 8px;
    border-radius:10px;
}
</style>

</head>
<body>

<h1>📦 Inventario Starlink</h1>

<div class="card">

<label>Operación</label>

<select id="operacion" onchange="cambiarOperacion()">
    <option value="stock">Alta Stock</option>
    <option value="reserved">Reserva</option>
    <option value="shipped">Despacho</option>
    <option value="delivered">Entrega</option>
</select>

</div>

<div class="card" id="panelStock">

<label>Ubicación</label>

<select id="location">
    <option>Quesada</option>
    <option>CdS - NQN</option>
    <option>Depo PE</option>
    <option>Ramm</option>
</select>

<label>Motivo</label>

<input
id="reason"
value="Ingreso de equipo nuevo">

</div>

<div class="card oculto" id="panelMovimiento">

<label>Partner</label>

<select id="partnerId">
<option value="">Seleccione Partner</option>
<option value="ait">AITUE</option>
<option value="cirion">CIRION</option>
<option value="cmpc">CMPC</option>
<option value="itx-pe">INTERNEXA</option>
<option value="muncl">MUNDO</option>
<option value="redc">REDCOL</option>
<option value="sonda">SONDA</option>
<option value="tpzarg">TPZ-Argentina</option>
<option value="tpzchile">TPZ-Chile</option>
<option value="tpzcol">TPZ-Colombia</option>
<option value="tpzcostarica">TPZ-Costa Rica</option>
<option value="tpzdemo">TPZ-Ops</option>
<option value="tpzglobal">TPZ-Global</option>
<option value="tpzperu">TPZ-Peru</option>
</select>

<label>Customer</label>

<input
id="customerId"
placeholder="Customer ID">

<label>Ownership</label>

<select
id="ownershipType"
onchange="mostrarLease()">

<option value="byo">BYO</option>
<option value="leased">Leased</option>
<option value="owned">Owned</option>

</select>

<div id="leaseBlock" class="oculto">

<label>Contrato Leasing</label>

<input id="ownershipContractRef">

<label>Fin Leasing</label>

<input
type="date"
id="ownershipLeaseEndsAt">

</div>

</div>

<div class="card">

<label>Kit ID</label>

<input
id="kitInput"
placeholder="KIT00001"
onkeypress="if(event.key==='Enter') agregarKit()">

<button
class="btnAgregar"
onclick="agregarKit()">

➕ Agregar Kit

</button>

</div>

<div class="card">

<h3>

Equipos Cargados

<span
id="contador"
class="badge">

0

</span>

</h3>

<ul id="lista"></ul>

<button
class="btnCSV"
onclick="generarCSV()">

⬇ Descargar CSV

</button>

<button
class="btnLimpiar"
onclick="limpiarLista()">

🗑 Limpiar Lista

</button>

</div>

<script>

let equipos = [];

function cambiarOperacion(){

    const operacion =
        document.getElementById("operacion").value;

    const panelStock =
        document.getElementById("panelStock");

    const panelMovimiento =
        document.getElementById("panelMovimiento");

    if(operacion === "stock"){

        panelStock.classList.remove("oculto");
        panelMovimiento.classList.add("oculto");

    }else{

        panelStock.classList.add("oculto");
        panelMovimiento.classList.remove("oculto");

    }

}

function mostrarLease(){

    const tipo =
        document.getElementById("ownershipType").value;

    const bloque =
        document.getElementById("leaseBlock");

    if(tipo === "leased"){

        bloque.classList.remove("oculto");

    }else{

        bloque.classList.add("oculto");

    }

}

function agregarKit(){

    const kit =
        document.getElementById("kitInput")
        .value
        .trim()
        .toUpperCase();

    if(kit === "") return;

    if(equipos.includes(kit)){

        alert("El kit ya está cargado");
        return;

    }

    equipos.push(kit);

    document.getElementById("kitInput").value = "";

    actualizarLista();

}

function actualizarLista(){

    const lista =
        document.getElementById("lista");

    lista.innerHTML = "";

    document.getElementById("contador").innerText =
        equipos.length;

    equipos.forEach((kit,index)=>{

        let li =
            document.createElement("li");

        li.innerHTML =
            kit +
            ' <a href="#" onclick="eliminarKit(' +
            index +
            ');return false;">❌</a>';

        lista.appendChild(li);

    });

}

function eliminarKit(index){

    equipos.splice(index,1);

    actualizarLista();

}

function limpiarLista(){

    equipos = [];

    actualizarLista();

}

function generarCSV(){

    if(equipos.length === 0){

        alert("No hay kits cargados");
        return;

    }

    const operacion =
        document.getElementById("operacion").value;

    let csv = "";

    if(operacion === "stock"){

        const motivo =
            document.getElementById("reason").value;

        const ubicacion =
            document.getElementById("location").value;

        csv =
            "kitId,state,reason,location\n";

        equipos.forEach(kit=>{

            csv +=
`${kit},in_stock,${motivo},${ubicacion}\n`;
