<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Starlink</title>
<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    margin:0;
    padding:15px;
    background:#f4f6f9;
}
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
h1{
    text-align:center;
    color:#16325c;
}
label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
    font-size: 14px;
    color: #333;
    text-transform: uppercase;
}
input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size: 16px;
}
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight: bold;
}
.btnAgregar{ background:#28a745; }
.btnEscanear{ background:#495057; }
.btnDetener{ background:#dc3545; margin-top: 5px; }
.btnCSV{ background:#28a745; }
.btnLimpiar{ background:#dc3545; }
.oculto{ display:none; }
ul{
    list-style:none;
    padding:0;
    margin: 0;
}
li{
    background:#f5f5f5;
    padding:12px;
    margin-bottom:8px;
    border-radius:6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    color: #16325c;
}
.badge{
    background:#16325c;
    color:white;
    padding:4px 10px;
    border-radius:10px;
    font-size: 14px;
}
/* Contenedor de la cámara con esquinas de enfoque */
#scanner-container {
    position: relative;
    width: 100%;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 10px;
}
#reader{
    width: 100%;
}
.viewfinder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 120px;
    border: 2px dashed rgba(255,255,255,0.4);
    pointer-events: none;
    box-sizing: border-box;
}
.viewfinder::before, .viewfinder::after {
    content: '';
    position: absolute;
    width: 25px;
    height: 25px;
    border-color: white;
    border-style: solid;
}
.viewfinder::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
.viewfinder::after { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
.viewfinder-bottom-left {
    position: absolute; bottom: -2px; left: -2px; width: 25px; height: 25px; border-color: white; border-style: solid; border-width: 0 0 4px 4px;
}
.viewfinder-bottom-right {
    position: absolute; bottom: -2px; right: -2px; width: 25px; height: 25px; border-color: white; border-style: solid; border-width: 0 4px 4px 0;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<h1>📦 Inventario Starlink</h1>

<div class="card">
    <label>Operación</label>
    <select id="operacion" onchange="cambiarOperacion()">
        <option value="stock">Alta Stock</option>
        <option value="reserved">Reserva</option>
        <option value="shipped">Despacho</option>
        <option value="delivered">Entrega</option>
    </select>
</div>

<div class="card" id="panelStock">
    <label>Ubicación</label>
    <select id="location">
        <option>Quesada</option>
        <option>CdS - NQN</option>
        <option value="Depo PE">Depo PE</option>
        <option>Ramm</option>
    </select>
    <label>Motivo / Remito</label>
    <input id="reason" value="Ingreso de equipo nuevo">
</div>

<div class="card oculto" id="panelMovimiento">
    <label>Partner</label>
    <select id="partnerId">
        <option value="">Seleccione Partner</option>
        <option value="ait">AITUE</option>
        <option value="cirion">CIRION</option>
        <option value="cmpc">CMPC</option>
        <option value="itx-pe">INTERNEXA</option>
        <option value="muncl">MUNDO</option>
        <option value="redc">REDCOL</option>
        <option value="sonda">SONDA</option>
        <option value="tpzarg">TPZ-Argentina</option>
        <option value="tpzchile">TPZ-Chile</option>
        <option value="tpzcol">TPZ-Colombia</option>
        <option value="tpzcostarica">TPZ-Costa Rica</option>
        <option value="tpzdemo">TPZ-Ops</option>
        <option value="tpzglobal">TPZ-Global</option>
        <option value="tpzperu">TPZ-Peru</option>
    </select>

    <label>Cliente Destino (Customer)</label>
    <input id="customerId" placeholder="Ej: PASON">

    <label>Ownership</label>
    <select id="ownershipType" onchange="mostrarLease()">
        <option value="byo">BYO</option>
        <option value="leased">Leased</option>
        <option value="owned">Owned</option>
    </select>

    <div id="leaseBlock" class="oculto">
        <label>Contrato Leasing</label>
        <input id="ownershipContractRef">
        
        <label>Fin Leasing</label>
        <input type="date" id="ownershipLeaseEndsAt">
    </div>
</div>

<div class="card">
    <label>📷 Escáner de Códigos</label>
    <button class="btnEscanear" onclick="iniciarEscaneo()">▶ Activar Cámara</button>
    
    <div id="scanner-container" class="oculto">
        <div id="reader"></div>
        <div class="viewfinder">
            <div class="viewfinder-bottom-left"></div>
            <div class="viewfinder-bottom-right"></div>
        </div>
    </div>
    <button id="btnDetenerCamara" class="btnDetener oculto" onclick="detenerEscaneo()">❌ Apagar Cámara</button>
    
    <label style="margin-top: 15px;">Kit ID Manual o Escaneado</label>
    <div style="display: flex; gap: 10px;">
        <!-- Se agregó oninput para forzar mayúsculas automáticamente al escribir -->
        <input id="kitInput" placeholder="Ej: KIT123456789" oninput="this.value = this.value.toUpperCase()" onkeypress="if(event.key==='Enter') agregarKit()" style="flex: 1;">
        <button class="btnAgregar" onclick="agregarKit()" style="width: 120px; margin-top: 0;">➕ Agregar</button>
    </div>
</div>

<div class="card">
    <h3>Equipos Escaneados <span id="contador" class="badge">0</span></h3>
    <ul id="lista"></ul>
    <button class="btnCSV" onclick="generarCSV()" style="margin-top: 15px;">⬇ Descargar CSV</button>
    <button class="btnLimpiar" onclick="limpiarLista()">🗑 Limpiar Lista</button>
</div>

<script>
let equipos = [];
let html5QrCode = null;

function cambiarOperacion(){
    const operacion = document.getElementById("operacion").value;
    const panelStock = document.getElementById("panelStock");
    const panelMovimiento = document.getElementById("panelMovimiento");

    if(operacion === "stock"){
        panelStock.classList.remove("oculto");
        panelMovimiento.classList.add("oculto");
    } else {
        panelStock.classList.add("oculto");
        panelMovimiento.classList.remove("oculto");
    }
}

function mostrarLease(){
    const tipo = document.getElementById("ownershipType").value;
    const bloque = document.getElementById("leaseBlock");

    if(tipo === "leased"){
        bloque.classList.remove("oculto");
    } else {
        bloque.classList.add("oculto");
    }
}

function agregarKit(){
    const kitInput = document.getElementById("kitInput");
    const kit = kitInput.value.trim().toUpperCase();

    if(kit === "") return;

    if(equipos.includes(kit)){
        alert("El kit ya está cargado");
        kitInput.value = "";
        return;
    }

    equipos.push(kit);
    kitInput.value = "";
    actualizarLista();
}

function actualizarLista(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    document.getElementById("contador").innerText = equipos.length;

    equipos.forEach((kit, index) => {
        let li = document.createElement("li");
        li.innerHTML = kit + ' <a href="#" onclick="eliminarKit(' + index + ');return false;" style="text-decoration:none; color: #dc3545; font-size: 18px;">❌</a>';
        lista.appendChild(li);
    });
}

function eliminarKit(index){
    equipos.splice(index, 1);
    actualizarLista();
}

function limpiarLista(){
    equipos = [];
    actualizarLista();
}

function iniciarEscaneo() {
    const container = document.getElementById("scanner-container");
    const btnDetener = document.getElementById("btnDetenerCamara");
    
    container.classList.remove("oculto");
    btnDetener.classList.remove("oculto");

    if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
    }

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 15,
            qrbox: { width: 250, height: 120 }
        },
        (decodedText, decodedResult) => {
            document.getElementById("kitInput").value = decodedText.trim().toUpperCase();
            agregarKit();
            if (navigator.vibrate) navigator.vibrate(100);
        },
        (errorMessage) => {
            // Ignorar errores de frame para lectura continua
        }
    ).catch(err => {
        alert("No se pudo acceder a la cámara. Asegúrate de dar permisos.");
        detenerEscaneo();
    });
}

function detenerEscaneo() {
    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
            document.getElementById("scanner-container").classList.add("oculto");
            document.getElementById("btnDetenerCamara").classList.add("oculto");
        }).catch(err => {
            console.error("Error al detener", err);
        });
    } else {
        document.getElementById("scanner-container").classList.add("oculto");
        document.getElementById("btnDetenerCamara").classList.add("oculto");
    }
}

function generarCSV(){
    if(equipos.length === 0){
        alert("No hay kits cargados");
        return;
    }

    const operacion = document.getElementById("operacion").value;
    let csvContent = "";

    if(operacion === "stock"){
        const motivo = document.getElementById("reason").value.trim();
        const ubicacion = document.getElementById("location").value.trim();
        
        csvContent = "kitId,state,reason,location\n";
        equipos.forEach(kit => {
            csvContent += `${kit},in_stock,${motivo},${ubicacion}\n`;
        });
    } else {
        const partner = document.getElementById("partnerId").value.trim();
        const customer = document.getElementById("customerId").value.trim();
        const ownership = document.getElementById("ownershipType").value.trim();
        const contractRef = document.getElementById("ownershipContractRef").value.trim();
        const leaseEnds = document.getElementById("ownershipLeaseEndsAt").value.trim();

        csvContent = "kitId,state,partnerId,customerId,ownershipType,ownershipContractRef,ownershipLeaseEndsAt\n";
        equipos.forEach(kit => {
            csvContent += `${kit},${operacion},${partner},${customer},${ownership},${contractRef},${leaseEnds}\n`;
        });
    }

    const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `inventario_${operacion}_${new Date().toISOString().slice(0,10)}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
